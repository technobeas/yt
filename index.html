<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kids Safe YouTube — Custom Player</title>
    <meta
      http-equiv="Permissions-Policy"
      content="
    autoplay=*, 
    encrypted-media=*, 
    accelerometer=*, 
    gyroscope=*, 
    picture-in-picture=*,
    clipboard-write=*,
    web-share=*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* ---------- Base ---------- */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f7f7f7;
        line-height: 1.4;
        -webkit-touch-callout: none;
        color: #222;
      }
      header {
        background: linear-gradient(90deg, #ff5252, #ff7b7b);
        padding: 12px 10px;
        color: #fff;
        font-size: 22px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      .container {
        padding: 15px;
        max-width: 1100px;
        margin: 0 auto;
      }
      h2,
      h3 {
        margin: 10px 0;
        color: #333;
      }

      /* grid & cards */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
        align-items: start;
      }
      .card {
        background: #fff;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        text-align: left;
        transition: transform 0.16s, box-shadow 0.16s;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      .thumb-wrap {
        position: relative;
        cursor: pointer;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card h3 {
        font-size: 15px;
        margin: 4px 0;
        color: #111;
        min-height: 38px;
      }
      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #666;
      }

      /* buttons / inputs */
      button,
      .btn {
        padding: 10px 12px;
        cursor: pointer;
        font-size: 15px;
        border: none;
        border-radius: 8px;
        background: #ff5252;
        color: #fff;
        transition: background 0.12s, transform 0.08s;
      }
      button:hover,
      .btn:hover {
        background: #e04343;
      }
      .small-btn {
        padding: 8px 10px;
        max-width: 140px;
        font-size: 13px;
      }

      #adminPanel,
      #kidsView,
      #shutdownScreen {
        display: none;
      }
      #shutdownScreen {
        font-size: 28px;
        text-align: center;
        margin-top: 40px;
        color: red;
        padding: 10px;
      }

      .input {
        padding: 10px;
        width: 90%;
        margin: 5px 0 10px 0;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 15px;
      }

      /* player & click blocker */
      #playerContainer {
        position: relative;
        margin-top: 10px;
        border-radius: 10px;
        overflow: hidden;
        background: black;
        width: 100%;
        max-width: 900px;
        height: 0;
        padding-bottom: 56.25%; /* 16:9 */
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        margin-left: auto;
        margin-right: auto;
      }
      #playerWrapper {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #clickBlocker {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }

      /* default player element */
      #player {
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* controls */
      .controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.6),
          rgba(0, 0, 0, 0.2) 30%,
          rgba(0, 0, 0, 0)
        );
        padding: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
      }
      .controls-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-plain {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        padding: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 8px;
      }

      .time {
        color: #eee;
        font-size: 13px;
        min-width: 60px;
        text-align: center;
      }

      .seek {
        position: relative;
        height: 12px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        flex: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      .seek .buffered {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        background: rgba(255, 255, 255, 0.28);
        border-radius: 6px;
        z-index: 1;
        transition: width 0.2s linear;
      }
      .seek .progress {
        position: relative;
        height: 100%;
        width: 0%;
        background: #4fc3f7;
        border-radius: 6px;
        z-index: 2;
        transition: width 140ms linear;
      }
      .seek .thumb {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 18px;
        height: 18px;
        background: #00bcd4;
        border-radius: 50%;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        z-index: 3;
      }

      .center-play {
        position: absolute;
        z-index: 35;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 36px;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      }

      .player-overlay-badge {
        position: absolute;
        left: 10px;
        bottom: 80px;
        z-index: 45;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }

      /* small responsive tweaks */
      @media (max-width: 900px) {
        .thumb-wrap {
          height: 160px;
        }
        .card {
          border-radius: 8px;
        }
        header {
          font-size: 20px;
        }
        .container {
          padding: 12px;
        }
      }

      /* admin list table */
      #adminList table {
        width: 100%;
        border-collapse: collapse;
      }
      #adminList th,
      #adminList td {
        padding: 8px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }
      #adminList img {
        width: 90px;
        height: 54px;
        object-fit: cover;
        border-radius: 6px;
      }

      .dragging-row {
        opacity: 0.45;
      }

      .controls-hidden {
        opacity: 0;
        transform: translateY(6px);
        pointer-events: none;
      }

      /* accessibility focus */
      .btn-plain:focus {
        outline: 2px solid rgba(255, 82, 82, 0.6);
        outline-offset: 2px;
      }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body>
    <header>Kids Safe YouTube</header>

    <div class="container">
      <!-- Login -->
      <div id="loginScreen">
        <h2>Choose Mode</h2>
        <button onclick="login('admin')">Parent Login</button>
        <button onclick="login('kid')">Kids Mode</button>
      </div>

      <!-- Shutdown -->
      <div id="shutdownScreen">Viewing paused by parent.</div>

      <!-- Kids View -->
      <div id="kidsView" aria-live="polite">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
            flex-wrap: wrap;
          "
        >
          <h2 style="margin: 0">Approved Videos</h2>
          <div style="display: flex; gap: 10px; align-items: center">
            <label style="font-size: 14px; color: #444">Profile:</label>
            <select
              id="kidProfile"
              class="input"
              style="width: 150px; padding: 8px; margin: 0"
              onchange="onProfileChange()"
            >
              <option>Hannana</option>
              <option>Sheema</option>
              <option>All</option>
            </select>
          </div>
        </div>

        <!-- Player ALWAYS above list -->
        <div id="playerContainer" aria-label="Video player">
          <div id="playerWrapper">
            <div id="clickBlocker"></div>

            <!-- player will be injected into this element -->
            <div id="player">
              <p style="color: white; text-align: center">
                Select a video to watch
              </p>
            </div>

            <!-- Center floating play/pause -->
            <button
              id="centerPlay"
              class="center-play"
              aria-label="Play"
              title="Play/Pause"
            >
              ▶
            </button>

            <!-- overlay badge -->
            <div id="playerOverlay" class="player-overlay-badge"></div>

            <!-- Custom controls (dark theme) -->
            <div id="controls" class="controls">
              <div
                class="seek"
                id="seekBar"
                aria-label="Seek bar"
                role="slider"
                tabindex="0"
              >
                <div class="buffered" id="bufferedBar"></div>
                <div class="progress" id="progressBar"></div>
                <div class="thumb" id="seekThumb" style="left: 0%"></div>
              </div>

              <div class="controls-row">
                <button
                  id="prevBtn"
                  class="btn-plain"
                  title="Previous"
                  aria-label="Previous"
                >
                  ⏮
                </button>
                <button
                  id="playBtn"
                  class="btn-plain"
                  title="Play/Pause"
                  aria-label="Play"
                >
                  ▶
                </button>
                <button
                  id="muteBtn"
                  class="btn-plain"
                  title="Mute/Unmute"
                  aria-label="Mute"
                >
                  🔊
                </button>

                <div class="time" id="currentTime">0:00</div>

                <div style="flex: 1"></div>

                <div class="time" id="durationTime">0:00</div>
                <button
                  id="fsBtn"
                  class="btn-plain"
                  title="Fullscreen"
                  aria-label="Fullscreen"
                >
                  ⛶
                </button>
                <button
                  id="nextBtn"
                  class="btn-plain"
                  title="Next"
                  aria-label="Next"
                >
                  ⏭
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="list-wrap" style="margin-top: 16px">
          <div id="kidsGrid" class="grid" aria-label="Videos list"></div>
        </div>
      </div>

      <!-- Admin Panel -->
      <div id="adminPanel">
        <h2>Parent Dashboard</h2>

        <div class="row" style="margin-bottom: 14px">
          <h3>Add Approved Video</h3>
          <input
            id="videoURL"
            class="input"
            placeholder="Paste YouTube URL or ID"
          />
          <div
            style="display: flex; gap: 8px; align-items: center; margin: 8px 0"
          >
            <label style="font-size: 14px">Assign to:</label>
            <label
              ><input type="checkbox" id="recipientHannana" checked />
              Hannana</label
            >
            <label><input type="checkbox" id="recipientSheema" /> Sheema</label>
            <label><input type="checkbox" id="recipientAll" /> All</label>
          </div>
          <button onclick="addVideo()">Add Video</button>
        </div>

        <div class="row">
          <h3>Remote Shutdown</h3>
          <button onclick="shutdown()">Shutdown Kids Screen</button>
          <button onclick="reactivate()">Reactivate</button>
        </div>

        <div class="row">
          <h3>Approved Videos (drag to reorder)</h3>
          <div id="adminList"></div>
        </div>
      </div>
    </div>

    <script>
      /* =================== Firebase config =================== */
      const firebaseConfig = {
        apiKey: "AIzaSyB5QL5b9VitYEKzFHNCH6xwV0hSqyiTPrY",
        authDomain: "kidssafeyt.firebaseapp.com",
        databaseURL:
          "https://kidssafeyt-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "kidssafeyt",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      /* =================== App state =================== */
      let data = {
        videos: [],
        allowShorts: false,
        shutdown: false,
        timeLimit: 0,
        watchedToday: 0,
      };
      let filteredVideos = []; // videos after applying shorts filter + recipients
      let currentProfile = "Hannana";
      let player = null;
      let currentVideoGlobalIndex = -1; // index in filteredVideos array
      let progressTimer = null;
      let isDraggingSeek = false;
      let seekRect = null;
      let dragDisabledSwipe = false;

      // store latest admin list for drag/reorder
      let latestAdminVideos = [];

      /* =================== Helpers =================== */
      function extractVideoId(url) {
        if (!url) return null;
        // handle raw id
        if (/^[a-zA-Z0-9_-]{8,}$/.test(url)) return url;
        const patterns = [
          /v=([^&]+)/,
          /youtu\.be\/([^?&]+)/,
          /embed\/([^?&]+)/,
          /youtube.com\/shorts\/([^?&]+)/,
        ];
        for (const p of patterns) {
          const m = url.match(p);
          if (m) return m[1];
        }
        return null;
      }
      function escapeHtml(text) {
        if (!text) return "";
        return text.replace(/[&<>"']/g, function (m) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[m];
        });
      }
      function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return "0:00";
        sec = Math.floor(sec);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      /* =================== updateOverlay =================== */
      function updateOverlay() {
        try {
          updateControlsState();
        } catch (e) {}
        const overlay = document.getElementById("playerOverlay");
        const center = document.getElementById("centerPlay");
        const ctrl = document.getElementById("controls");

        if (!overlay || !center || !ctrl) return;

        if (
          currentVideoGlobalIndex >= 0 &&
          filteredVideos[currentVideoGlobalIndex]
        ) {
          overlay.style.display = "block";
          overlay.textContent = `Playing ${currentVideoGlobalIndex + 1} / ${
            filteredVideos.length
          }`;
        } else {
          overlay.style.display = "none";
        }

        if (player && typeof player.getPlayerState === "function") {
          const st = player.getPlayerState();
          if (st === YT.PlayerState.PLAYING) {
            center.classList.add("hidden");
          } else {
            center.classList.remove("hidden");
          }
        } else {
          center.classList.remove("hidden");
        }

        ctrl.classList.remove("hidden");
        if (typeof controlsHideTimer !== "undefined" && controlsHideTimer)
          clearTimeout(controlsHideTimer);
        window.controlsHideTimer = setTimeout(() => {
          if (
            player &&
            typeof player.getPlayerState === "function" &&
            player.getPlayerState() === YT.PlayerState.PLAYING
          ) {
            ctrl.classList.add("controls-hidden");
            center.classList.add("hidden");
          }
        }, 3000);
      }

      /* =================== Login & DB listeners =================== */
      function login(role) {
        document.getElementById("loginScreen").style.display = "none";
        if (role === "admin") {
          document.getElementById("adminPanel").style.display = "block";
          document.getElementById("kidsView").style.display = "none";
          loadAdmin();
        } else {
          // kids: listen for shutdown and videos
          db.ref("shutdown").on("value", (snap) => {
            data.shutdown = snap.val();
            if (data.shutdown) showShutdown();
            else {
              document.getElementById("shutdownScreen").style.display = "none";
              document.getElementById("kidsView").style.display = "block";
              loadKidsFromState();
            }
          });
          db.ref("videos").on("value", (snap) => {
            data.videos = snap.val() || [];
            loadKidsFromState();
            loadAdmin();
          });
          db.ref("allowShorts").on("value", (snap) => {
            data.allowShorts = snap.val() || false;
            loadKidsFromState();
          });
          db.ref("timeLimit").on("value", (snap) => {
            data.timeLimit = snap.val() || 0;
          });
        }
      }

      /* =================== Admin actions =================== */
      function addVideo() {
        const url = document.getElementById("videoURL").value.trim();
        const id = extractVideoId(url);
        if (!id) return alert("Invalid YouTube URL or ID");

        // recipients
        const rR = document.getElementById("recipientHannana").checked;
        const rH = document.getElementById("recipientSheema").checked;
        const rA = document.getElementById("recipientAll").checked;
        let recipients = [];
        if (rA) recipients = ["All"];
        else {
          if (rR) recipients.push("Hannana");
          if (rH) recipients.push("Sheema");
          if (recipients.length === 0) recipients = ["All"];
        }

        const thumb = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
        // fetch oembed for title if possible
        fetch(
          `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`
        )
          .then((res) => {
            if (!res.ok) throw new Error("oembed");
            return res.json();
          })
          .then((meta) => {
            db.ref("videos")
              .once("value")
              .then((snap) => {
                const vids = snap.val() || [];
                const item = {
                  id: id,
                  title: meta.title,
                  thumbnail: thumb,
                  duration: 200,
                  recipients: recipients,
                  addedAt: Date.now(),
                };
                // new videos first
                vids.unshift(item);
                db.ref("videos").set(vids);
                document.getElementById("videoURL").value = "";
                document.getElementById("recipientHannana").checked = true;
                document.getElementById("recipientSheema").checked = false;
                document.getElementById("recipientAll").checked = false;
                loadAdmin();
                alert("Video added and assigned!");
              });
          })
          .catch((e) => {
            console.warn(e);
            // fallback
            db.ref("videos")
              .once("value")
              .then((snap) => {
                const vids = snap.val() || [];
                const item = {
                  id: id,
                  title: id,
                  thumbnail: thumb,
                  duration: 200,
                  recipients: recipients,
                  addedAt: Date.now(),
                };
                vids.unshift(item);
                db.ref("videos").set(vids);
                document.getElementById("videoURL").value = "";
                loadAdmin();
                alert("Video added (fallback title).");
              });
          });
      }

      function shutdown() {
        db.ref("shutdown").set(true);
        alert("Kids screen paused!");
      }
      function reactivate() {
        db.ref("shutdown").set(false);
        alert("Kids screen reactivated!");
      }

      /* =================== Admin list with drag & reorder =================== */
      function loadAdmin() {
        db.ref("videos")
          .once("value")
          .then((snap) => {
            const vids = snap.val() || [];
            // sort newest first by addedAt if present
            vids.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

            // keep global copy for drag reorder
            latestAdminVideos = vids.slice();

            let html = `<table><thead><tr><th style="width:40%;">Title</th><th style="width:20%;">Thumbnail</th><th style="width:15%;">Duration</th><th style="width:15%;">Recipients</th><th style="width:10%;">Action</th></tr></thead><tbody>`;
            vids.forEach((v, i) => {
              const rec = v.recipients
                ? Array.isArray(v.recipients)
                  ? v.recipients.join(", ")
                  : v.recipients
                : "All";
              const added = v.addedAt
                ? new Date(v.addedAt).toLocaleString()
                : "-";
              // each row draggable
              html += `<tr draggable="true" data-index="${i}" class="admin-row">
                       <td><strong>${escapeHtml(
                         v.title
                       )}</strong><div style="font-size:12px;color:#777;margin-top:4px;">Added: ${escapeHtml(
                added
              )}</div></td>
                       <td><img src="${escapeHtml(
                         v.thumbnail
                       )}" alt="${escapeHtml(v.title)}"></td>
                       <td>${v.duration || 0}s</td>
                       <td>${escapeHtml(rec)}</td>
                       <td><button class="small-btn" onclick="deleteVideo(${i})">Delete</button></td>
                     </tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById("adminList").innerHTML = html;

            // attach drag handlers after DOM created
            attachAdminDragHandlers();
          });
      }

      function attachAdminDragHandlers() {
        const rows = document.querySelectorAll("#adminList .admin-row");
        let dragSrcIndex = null;

        rows.forEach((r) => {
          r.addEventListener("dragstart", (e) => {
            dragSrcIndex = Number(r.dataset.index);
            r.classList.add("dragging-row");
            e.dataTransfer?.setData("text/plain", String(dragSrcIndex));
            // some browsers need effectAllowed
            if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
          });

          r.addEventListener("dragend", () => {
            r.classList.remove("dragging-row");
            dragSrcIndex = null;
          });

          r.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            r.style.boxShadow = "inset 0 0 0 2px rgba(0,0,0,0.06)";
          });

          r.addEventListener("dragleave", () => {
            r.style.boxShadow = "";
          });

          r.addEventListener("drop", (e) => {
            e.preventDefault();
            r.style.boxShadow = "";
            const src =
              dragSrcIndex !== null
                ? dragSrcIndex
                : Number(e.dataTransfer.getData("text/plain"));
            const dest = Number(r.dataset.index);
            if (isNaN(src) || isNaN(dest) || src === dest) return;

            // reorder latestAdminVideos
            const arr = latestAdminVideos.slice();
            const [moved] = arr.splice(src, 1);
            arr.splice(dest, 0, moved);

            // persist new order to DB
            db.ref("videos")
              .set(arr)
              .then(() => {
                // refresh admin UI
                loadAdmin();
              })
              .catch(() => {
                alert("Failed to save new order. Check connectivity.");
              });
          });
        });
      }

      function deleteVideo(index) {
        db.ref("videos")
          .once("value")
          .then((snap) => {
            const vids = snap.val() || [];
            if (index >= 0 && index < vids.length) {
              if (!confirm("Delete this video?")) return;
              vids.splice(index, 1);
              db.ref("videos").set(vids);
            }
          });
      }

      /* =================== Kids list (no pagination) =================== */
      function loadKidsFromState() {
        if (data.shutdown) return;
        // copy and normalize recipients
        const all = (data.videos || []).map((v) => {
          const copy = Object.assign({}, v);
          if (!copy.recipients) copy.recipients = ["All"];
          return copy;
        });

        // filter by allowShorts
        let pool = all.slice();
        if (!data.allowShorts) {
          pool = pool.filter((v) => (v.duration || 999) >= 60);
        }

        // filter by profile
        pool = pool.filter((v) => {
          if (!v.recipients) return true;
          if (v.recipients.includes("All")) return true;
          if (currentProfile === "All") return true;
          return v.recipients.includes(currentProfile);
        });

        // sort newest first
        pool.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

        filteredVideos = pool;
        renderKidsGrid();
        updateOverlay();
        // auto-play first if none
        autoPlayFirstIfNone();
      }

      function renderKidsGrid() {
        const grid = document.getElementById("kidsGrid");
        grid.innerHTML = "";
        if (filteredVideos.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666; padding:40px 10px; background:#fff; border-radius:8px;">No approved videos for ${escapeHtml(
            currentProfile
          )} yet.</div>`;
          return;
        }
        filteredVideos.forEach((v, idx) => {
          const card = document.createElement("div");
          card.className = "card";
          const addedAgo = v.addedAt
            ? new Date(v.addedAt).toLocaleDateString()
            : "";
          // NOTE: removed duration badge per request
          card.innerHTML = `
          <div class="thumb-wrap" role="button" tabindex="0" aria-label="Play ${escapeHtml(
            v.title
          )}" data-index="${idx}">
            <img src="${escapeHtml(v.thumbnail)}" alt="${escapeHtml(v.title)}">
          </div>
          <div style="flex:1;">
            <h3>${escapeHtml(v.title)}</h3>
            <div class="meta-row">
              <div style="display:flex; gap:8px; align-items:center;">
                <div style="font-size:13px; color:#666;">${escapeHtml(
                  addedAgo
                )}</div>
              </div>
              <div style="font-size:13px; color:#777;">${escapeHtml(
                (v.recipients || ["All"]).join(", ")
              )}</div>
            </div>
          </div>
        `;
          // click thumbnail to play and scroll to player
          const thumb = card.querySelector(".thumb-wrap");
          thumb.addEventListener("click", () => {
            currentVideoGlobalIndex = idx;
            playByIndex(idx);
            // scroll to player smoothly
            const pc = document.getElementById("playerContainer");
            if (pc && pc.scrollIntoView)
              pc.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          thumb.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              currentVideoGlobalIndex = idx;
              playByIndex(idx);
              const pc = document.getElementById("playerContainer");
              if (pc && pc.scrollIntoView)
                pc.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
          grid.appendChild(card);
        });
      }

      /* =================== Player creation & controls wiring =================== */
      function onYouTubeIframeAPIReady() {
        /* YT API will be used when creating players */
      }

      function playByIndex(index) {
        if (index < 0 || index >= filteredVideos.length) return;
        const id = filteredVideos[index].id;
        currentVideoGlobalIndex = index;
        play(id);
        updateOverlay();
      }

      function play(videoId) {
        const playerContainer = document.getElementById("playerContainer");

        // remove old player and recreate container
        const old = playerContainer.querySelector("#player");
        if (old) old.remove();
        const playerDiv = document.createElement("div");
        playerDiv.id = "player";
        playerDiv.setAttribute("allowfullscreen", "true");
        playerDiv.setAttribute("webkitallowfullscreen", "true");
        playerDiv.setAttribute("mozallowfullscreen", "true");
        // place inside wrapper
        const wrapper = document.getElementById("playerWrapper");
        wrapper.insertBefore(playerDiv, document.getElementById("centerPlay"));

        const newClickBlocker = playerContainer.querySelector("#clickBlocker");
        if (newClickBlocker) newClickBlocker.style.pointerEvents = "none";

        if (player && typeof player.destroy === "function") {
          try {
            player.destroy();
          } catch (e) {}
        }
        player = new YT.Player("player", {
          height: "100%",
          width: "100%",
          videoId: videoId,
          playerVars: {
            rel: 0,
            modestbranding: 1,
            controls: 0,
            iv_load_policy: 3,
            fs: 1,
            playsinline: 1,
            autoplay: 1, // attempt autoplay when inserted
          },
          events: {
            onReady: (event) => {
              // attempt to play (some browsers will block autoplay unless user gesture)
              try {
                event.target.unMute();
              } catch (e) {}
              try {
                event.target.playVideo();
              } catch (e) {}
              if (newClickBlocker) newClickBlocker.style.pointerEvents = "auto";
              data.watchedToday = (data.watchedToday || 0) + 1;
              startProgressTimer();
              updateControlsState();
              updateOverlay();
            },
            onStateChange: (ev) => {
              updateControlsState();
              if (ev.data === YT.PlayerState.ENDED) {
                stopProgressTimer();
                // autoplay immediately to next (infinite loop)
                nextVideoAuto();
                updateOverlay();
              } else if (ev.data === YT.PlayerState.PLAYING) {
                startProgressTimer();
              } else if (ev.data === YT.PlayerState.PAUSED) {
                stopProgressTimer();
              }
            },
          },
        });
      }

      /* progress / UI update */
      function startProgressTimer() {
        stopProgressTimer();
        progressTimer = setInterval(() => {
          try {
            updateProgressUI();
          } catch (e) {}
        }, 250);
      }
      function stopProgressTimer() {
        if (progressTimer) {
          clearInterval(progressTimer);
          progressTimer = null;
        }
      }

      function updateProgressUI() {
        if (!player || typeof player.getDuration !== "function") return;
        const dur = player.getDuration();
        const cur = player.getCurrentTime();
        // buffered
        let bufferedPercent = 0;
        try {
          const vt = player.getVideoLoadedFraction();
          if (isFinite(vt)) bufferedPercent = Math.min(1, vt) * 100;
        } catch (e) {
          bufferedPercent = 0;
        }
        const prog =
          isFinite(dur) && dur > 0
            ? Math.max(0, Math.min(1, cur / dur)) * 100
            : 0;
        document.getElementById("progressBar").style.width = `${prog}%`;
        document.getElementById(
          "bufferedBar"
        ).style.width = `${bufferedPercent}%`;
        const thumb = document.getElementById("seekThumb");
        if (thumb) thumb.style.left = `${prog}%`;
        const curElem = document.getElementById("currentTime");
        const durElem = document.getElementById("durationTime");
        if (curElem) curElem.textContent = formatTime(cur);
        if (durElem) durElem.textContent = formatTime(dur);
      }

      function updateControlsState() {
        const playBtn = document.getElementById("playBtn");
        const centerPlay = document.getElementById("centerPlay");
        const muteBtn = document.getElementById("muteBtn");

        if (!player || typeof player.getPlayerState !== "function") {
          if (playBtn) {
            playBtn.textContent = "▶";
            playBtn.setAttribute("aria-label", "Play");
          }
          if (centerPlay) {
            centerPlay.textContent = "▶";
            centerPlay.setAttribute("aria-label", "Play");
          }
          return;
        }
        const st = player.getPlayerState();
        if (st === YT.PlayerState.PLAYING) {
          if (playBtn) {
            playBtn.textContent = "⏸";
            playBtn.setAttribute("aria-label", "Pause");
          }
          if (centerPlay) {
            centerPlay.textContent = "⏸";
            centerPlay.setAttribute("aria-label", "Pause");
          }
        } else {
          if (playBtn) {
            playBtn.textContent = "▶";
            playBtn.setAttribute("aria-label", "Play");
          }
          if (centerPlay) {
            centerPlay.textContent = "▶";
            centerPlay.setAttribute("aria-label", "Play");
          }
        }
        try {
          if (
            player.isMuted && typeof player.isMuted === "function"
              ? player.isMuted()
              : false
          ) {
            if (muteBtn) {
              muteBtn.textContent = "🔇";
              muteBtn.setAttribute("aria-label", "Unmute");
            }
          } else {
            if (muteBtn) {
              muteBtn.textContent = "🔊";
              muteBtn.setAttribute("aria-label", "Mute");
            }
          }
        } catch (e) {}
      }

      /* controls actions */
      function togglePlayPause() {
        if (!player || typeof player.getPlayerState !== "function") return;
        const st = player.getPlayerState();
        if (st === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
        updateControlsState();
      }
      function toggleMute() {
        if (!player) return;
        try {
          if (player.isMuted && player.isMuted()) player.unMute();
          else player.mute();
        } catch (e) {}
        updateControlsState();
      }
      function playPrev() {
        prevVideoAuto();
      }
      function playNext() {
        nextVideoAuto();
      }

      function toggleFullscreen() {
        const el = document.getElementById("playerContainer");
        if (!el) return;
        const isFullscreen =
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.msFullscreenElement;
        if (!isFullscreen) {
          if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } else {
          if (document.exitFullscreen)
            document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen)
            document.webkitExitFullscreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        }
      }

      /* seek handling */
      function initSeekInteractions() {
        const seek = document.getElementById("seekBar");
        const thumb = document.getElementById("seekThumb");

        function getSeekInfo(clientX) {
          if (!seekRect) seekRect = seek.getBoundingClientRect();
          const x = clientX - seekRect.left;
          const pct = Math.max(0, Math.min(1, x / seekRect.width));
          return { pct, x };
        }

        function onPointerDown(e) {
          isDraggingSeek = true;
          dragDisabledSwipe = true;
          seekRect = seek.getBoundingClientRect();
          seek.classList.add("dragging");
          document.body.style.userSelect = "none";
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const info = getSeekInfo(clientX);
          updateThumbByPct(info.pct);
        }

        function onPointerMove(e) {
          if (!isDraggingSeek) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const info = getSeekInfo(clientX);
          updateThumbByPct(info.pct);
        }

        function onPointerUp(e) {
          if (!isDraggingSeek) return;
          isDraggingSeek = false;
          seek.classList.remove("dragging");
          document.body.style.userSelect = "";
          const clientX =
            e.changedTouches && e.changedTouches[0]
              ? e.changedTouches[0].clientX
              : e.clientX || 0;
          const info = getSeekInfo(clientX);
          const dur = player && player.getDuration ? player.getDuration() : 0;
          const seekToSec = Math.max(0, Math.min(1, info.pct)) * dur;
          try {
            if (player && typeof player.seekTo === "function")
              player.seekTo(seekToSec, true);
          } catch (e) {}
          dragDisabledSwipe = false;
        }

        function updateThumbByPct(pct) {
          const progress = document.getElementById("progressBar");
          const thumbEl = document.getElementById("seekThumb");
          if (progress) progress.style.width = `${pct * 100}%`;
          if (thumbEl) thumbEl.style.left = `${pct * 100}%`;
          const dur = player && player.getDuration ? player.getDuration() : 0;
          const t = dur * pct;
          const curElem = document.getElementById("currentTime");
          if (curElem) curElem.textContent = formatTime(t);
        }

        if (seek) {
          seek.addEventListener("mousedown", onPointerDown);
          window.addEventListener("mousemove", onPointerMove);
          window.addEventListener("mouseup", onPointerUp);
          seek.addEventListener("touchstart", onPointerDown, { passive: true });
          window.addEventListener("touchmove", onPointerMove, {
            passive: true,
          });
          window.addEventListener("touchend", onPointerUp);
          seek.addEventListener("keydown", (e) => {
            const dur = player && player.getDuration ? player.getDuration() : 0;
            if (!dur) return;
            let cur = player.getCurrentTime();
            if (e.key === "ArrowRight") {
              cur = Math.min(dur, cur + 5);
              player.seekTo(cur, true);
            }
            if (e.key === "ArrowLeft") {
              cur = Math.max(0, cur - 5);
              player.seekTo(cur, true);
            }
          });
        }
      }

      /* =================== Next/Prev (wraps) =================== */
      function nextVideoAuto() {
        if (filteredVideos.length === 0) return;
        let idx =
          currentVideoGlobalIndex >= 0 ? currentVideoGlobalIndex + 1 : 0;
        if (idx >= filteredVideos.length) idx = 0; // infinite loop
        currentVideoGlobalIndex = idx;
        playByIndex(idx);
      }
      function prevVideoAuto() {
        if (filteredVideos.length === 0) return;
        let idx =
          currentVideoGlobalIndex > 0
            ? currentVideoGlobalIndex - 1
            : filteredVideos.length - 1;
        currentVideoGlobalIndex = idx;
        playByIndex(idx);
      }

      /* =================== Controls bindings & initialization =================== */
      function initControlBindings() {
        const playBtn = document.getElementById("playBtn");
        const center = document.getElementById("centerPlay");
        const mute = document.getElementById("muteBtn");
        const prev = document.getElementById("prevBtn");
        const next = document.getElementById("nextBtn");
        const fs = document.getElementById("fsBtn");
        const container = document.getElementById("playerContainer");

        if (playBtn)
          playBtn.addEventListener("click", () => {
            togglePlayPause();
            showControls();
          });
        if (center)
          center.addEventListener("click", () => {
            togglePlayPause();
            showControls();
          });
        if (mute)
          mute.addEventListener("click", () => {
            toggleMute();
            showControls();
          });
        if (prev)
          prev.addEventListener("click", () => {
            playPrev();
            showControls();
          });
        if (next)
          next.addEventListener("click", () => {
            playNext();
            showControls();
          });
        if (fs)
          fs.addEventListener("click", () => {
            toggleFullscreen();
            showControls();
          });

        ["mousemove", "touchstart", "touchmove"].forEach((ev) => {
          container.addEventListener(
            ev,
            () => {
              showControls();
            },
            { passive: true }
          );
        });

        document.addEventListener("fullscreenchange", () => {
          showControls();
          setTimeout(showControls, 250);
        });
        document.addEventListener("webkitfullscreenchange", () => {
          showControls();
          setTimeout(showControls, 250);
        });

        setInterval(() => {
          if (!isDraggingSeek) updateProgressUI();
          updateControlsState();
        }, 800);

        initSeekInteractions();
      }

      /* controls auto hide */
      let controlsHideTimer = null;
      function showControls() {
        const ctrl = document.getElementById("controls");
        if (!ctrl) return;
        ctrl.classList.remove("controls-hidden");
        const centerPlay = document.getElementById("centerPlay");
        if (centerPlay) centerPlay.classList.add("hidden");
        if (controlsHideTimer) clearTimeout(controlsHideTimer);
        controlsHideTimer = setTimeout(() => {
          if (
            player &&
            typeof player.getPlayerState === "function" &&
            player.getPlayerState() === YT.PlayerState.PLAYING
          ) {
            ctrl.classList.add("controls-hidden");
            if (centerPlay) centerPlay.classList.add("hidden");
          }
        }, 3000);
      }

      function hideControlsImmediate() {
        const ctrl = document.getElementById("controls");
        if (ctrl) ctrl.classList.add("controls-hidden");
        const centerPlay = document.getElementById("centerPlay");
        if (centerPlay) centerPlay.classList.add("hidden");
        if (controlsHideTimer) {
          clearTimeout(controlsHideTimer);
          controlsHideTimer = null;
        }
      }

      /* =================== Orientation / Fullscreen tweaks =================== */
      function handleOrientationChange() {
        const isLandscape = window.matchMedia(
          "(orientation: landscape)"
        ).matches;
        if (isLandscape) {
          const docEl = document.documentElement;
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => {});
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          }
          document.body.style.overflow = "hidden";
        } else {
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            try {
              document.exitFullscreen?.();
            } catch (e) {}
          }
          document.body.style.overflow = "auto";
        }
      }
      window.addEventListener(
        "orientationchange",
        () => {
          setTimeout(handleOrientationChange, 250);
        },
        false
      );

      /* =================== Auto-play first if none =================== */
      function autoPlayFirstIfNone() {
        if (filteredVideos.length === 0) return;
        if (currentVideoGlobalIndex === -1) {
          currentVideoGlobalIndex = 0;
          playByIndex(0);
        }
      }

      /* =================== Show shutdown view =================== */
      function showShutdown() {
        document.getElementById("kidsView").style.display = "none";
        document.getElementById("shutdownScreen").style.display = "block";
        if (player && typeof player.destroy === "function") {
          player.destroy();
          player = null;
        }
        const playerWrapper = document.getElementById("playerWrapper");
        playerWrapper.querySelector("#player")?.remove();
        const msg = document.createElement("p");
        msg.style.color = "white";
        msg.style.textAlign = "center";
        msg.style.paddingTop = "200px";
        msg.textContent = "Viewing paused by parent.";
        playerWrapper.appendChild(msg);
      }

      /* =================== Profile change handler =================== */
      function onProfileChange() {
        const sel = document.getElementById("kidProfile");
        currentProfile = sel.value || "Hannana";
        // stop current player to avoid playing content not assigned
        if (player && typeof player.destroy === "function") {
          player.destroy();
          player = null;
        }
        currentVideoGlobalIndex = -1;
        loadKidsFromState();
      }

      /* =================== Expose functions to global for inline calls =================== */
      window.playByIndex = playByIndex;
      window.shutdown = shutdown;
      window.reactivate = reactivate;
      window.addVideo = addVideo;
      window.login = login;
      window.onProfileChange = onProfileChange;
      window.nextVideoAuto = nextVideoAuto;
      window.prevVideoAuto = prevVideoAuto;

      /* =================== Load initial videos once and hook auto-play wrapper =================== */
      db.ref("videos")
        .once("value")
        .then((snap) => {
          data.videos = snap.val() || [];
        })
        .catch(() => {});
      const originalLoadKidsFromState = loadKidsFromState;
      loadKidsFromState = function () {
        originalLoadKidsFromState();
        // keep autoplay behavior on load
        if (document.getElementById("kidsView").style.display === "block") {
          autoPlayFirstIfNone();
        }
      };

      document.addEventListener("DOMContentLoaded", () => {
        initControlBindings();

        // Hide login screen and admin panel initially
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("shutdownScreen").style.display = "none";
        document.getElementById("kidsView").style.display = "block";

        // default kid profile
        currentProfile = "Hannana";
        document.getElementById("kidProfile").value = currentProfile;

        // Auto-login as kid
        login("kid");

        // ----- Desktop: secret key code ----- (unchanged)
        const secretCode = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown"];
        let secretIndex = 0;
        window.addEventListener("keydown", (e) => {
          const key = e.key;
          if (key === secretCode[secretIndex]) {
            secretIndex++;
            if (secretIndex === secretCode.length) {
              login("admin");
              document.getElementById("adminPanel").style.display = "block";
              document.getElementById("kidsView").style.display = "none";
              secretIndex = 0;
            }
          } else {
            secretIndex = 0;
          }
          if (document.getElementById("kidsView").style.display === "block") {
            if (key === "ArrowLeft") prevVideoAuto();
            else if (key === "ArrowRight") nextVideoAuto();
          }
        });

        // ----- Mobile: secret tap area -----
        let tapCount = 0;
        const requiredTaps = 5;
        let tapTimeout = null;
        const secretArea = document.createElement("div");
        secretArea.style.position = "fixed";
        secretArea.style.top = "0";
        secretArea.style.right = "0";
        secretArea.style.width = "50px";
        secretArea.style.height = "50px";
        secretArea.style.zIndex = "9999";
        document.body.appendChild(secretArea);
        secretArea.addEventListener("touchstart", () => {
          tapCount++;
          if (tapCount === requiredTaps) {
            login("admin");
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("kidsView").style.display = "none";
            tapCount = 0;
            clearTimeout(tapTimeout);
          } else {
            clearTimeout(tapTimeout);
            tapTimeout = setTimeout(() => {
              tapCount = 0;
            }, 1000);
          }
        });
      });

      // small ad-skip button logic retained but hidden if not applicable
      function updateAdState() {
        const skipBtn = document.getElementById("skipAdBtn");
        if (!skipBtn) return;
        if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
          skipBtn.style.display = "none";
          return;
        }
        if (player && typeof player.getPlayerState === "function") {
          skipBtn.style.display = "none";
        }
      }
      setInterval(updateAdState, 500);
    </script>
  </body>
